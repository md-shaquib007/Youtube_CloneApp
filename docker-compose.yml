version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/chaitube
      - REDIS_URI=redis://redis:6379
      - ACCESS_TOKEN_SECRET=chaitube_production_access_secret_key_123!
      - ACCESS_TOKEN_EXPIRY=1d
      - REFRESH_TOKEN_SECRET=chaitube_production_refresh_secret_key_123!
      - REFRESH_TOKEN_EXPIRY=10d
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
